name: Build APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: copyplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -gt 0

          tag="apk-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes_file="$(mktemp)"
          printf 'Debug APK built from %s.\n\nRun: %s\n' "$GITHUB_SHA" "$RUN_URL" > "$notes_file"

          gh release create "$tag" "${apks[@]}" \
            --target "$GITHUB_SHA" \
            --title "Copyplay debug APK ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "$notes_file" \
            --prerelease \
            --latest=false
